font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
# --- Window Look & Feel ---
# window_padding_width 12
confirm_os_window_close 0
background_opacity 0.85

# --- Cursor ---
cursor_shape block
shell_integration enabled no-cursor

# --- Performance ---
# Lowers latency for high-refresh monitors (like your 144Hz external)
repaint_delay 2
input_delay 1
sync_to_monitor yes

# --- Keybinds ---
# Copy/Paste using system clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_to_clipboard
