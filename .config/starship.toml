# ~/.config/starship.toml

add_newline = false

# Clean sequence: Path > Git > Languages > Prompt
format = """$directory$git_branch$git_status$rust$python$lua$json$markdown$character"""

[directory]
style = "bold cyan"
truncation_length = 0        # Disables truncation completely
fish_style_pwd_dir_length = 0 # Ensures full directory names are shown
format = "[$path]($style) "

[character]
success_symbol = "[λ](bold green) " # Minimal Greek Lambda or use "➜"
error_symbol = "[λ](bold red) "

# --- Minimalist Languages (Icons Only) ---
# We remove the ($version) to keep the line short

[rust]
symbol = "🦀"
style = "bold orange"
format = "[$symbol]($style) "

[python]
symbol = "🐍"
style = "bold yellow"
format = "[$symbol]($style) "

[lua]
symbol = "󰢱"
style = "bold blue"
format = "[$symbol]($style) "

# --- Clean Git ---

[git_branch]
symbol = "󰊢 " 
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'
