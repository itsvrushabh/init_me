[Theme]
# Path to a .colorscheme file or leave empty for defaults
color_scheme=Papirus-Dark
# Your icon theme name (e.g., Papirus-Dark)
icon_theme=Papirus-Dark
# The widget style (Fusion is the most stable for Wayland)
style=Fusion
# Your JetBrains font from earlier
font=JetBrainsMono Nerd Font
font_size=11
