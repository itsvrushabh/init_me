# --- 1. Auto-Bootstrap TPM ---
if-shell "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# =============================================
# 🚀 THE GOD CONFIG (WSL + ARCH + NVIM)
# =============================================
theme_color="gold"
# Ensure colors and fonts render correctly
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# --- Keybindings (Leader is Ctrl-a) ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Start numbering at 1 (Better for keyboard reach)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reload Config (Matches standard tmux path)
bind r source-file ~/.tmux.conf \; display "🚀 Config Reloaded!"

# --- General ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB" # True Color
set -s escape-time 0                            # No lag for Nvim
set -g history-limit 1000000                   # Infinite scrollback
# set -g status-position top                     # Clean top bar
set -g focus-events on                         # Let Nvim know when it has focus

# --- 📂 Smart Path Tracking (Always open in same path) ---
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"

# --- Navigation ---
# Vim-style pane switching (Seamless with Nvim plugin)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# --- Windows Clipboard (WSL Secret) ---
#setw -g mode-keys vi
#bind-key -T copy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"

# =============================================
# 🎨 STATUS BAR
# =============================================
set -g status-interval 1
set -g status-style "bg=default,fg=default"
set -g status-left-length 40
set -g status-left ""

# Right side: Time | Command | Path | Pane | Git | User
set -g status-right-length 150
set -g status-right "#[fg=cyan] 󰍛 %I:%M:%S %p #[fg=magenta]󰁹 #{battery_percentage}#[fg=$theme_color]  #{pane_current_command}   #{b:pane_current_path} 󱫋 #P 󰊢 #(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null) "

# Window Indicators
set -g window-status-format "  #I "
set -g window-status-current-format "  #{?client_prefix,#[fg=red]●#[fg=default],#[fg=$theme_color]●} "
set -g window-status-separator ""

# =============================================
# 📦 PLUGINS (TPM)
# =============================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'jamesoff/tmux-free'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-copycat'

# Plugin Settings
set -g @continuum-restore 'on'

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
