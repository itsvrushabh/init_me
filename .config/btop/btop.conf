#? Config file for btop v.1.4.6

#* Use your theme but disable background for transparency (looks better in Hyprland)
color_theme = "/usr/share/btop/themes/HotPurpleTrafficLight.theme"
theme_background = false

#* High-performance visuals
truecolor = true
terminal_sync = true
graph_symbol = "braille"
rounded_corners = true

#* GOD SPEED: Reduced from 2000ms to 500ms for real-time tracking
update_ms = 500

#* Navigation: Enabled Vim keys (h,j,k,l) for elite control
vim_keys = true

#* Process View: Tree mode enabled by default (better for seeing child processes)
proc_sorting = "cpu lazy"
proc_reversed = false
proc_tree = true
proc_colors = true
proc_gradient = true
proc_per_core = true

#* CPU Display: More detailed info
cpu_invert_lower = true
show_uptime = true
show_cpu_watts = true
check_temp = true
show_coretemp = true
show_cpu_freq = true

#* GPU & Battery
show_gpu_info = "Auto"
shown_gpus = "nvidia amd intel"
show_battery = true
show_battery_watts = true

#* Disks: Clean up the view
use_fstab = true
show_io_stat = true
io_mode = false

#* Auto-save changes made in the UI
save_config_on_exit = true
